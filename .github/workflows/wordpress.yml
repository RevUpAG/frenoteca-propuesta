# Publica el plugin Frenoteca 2026 en www.frenoteca.com cada vez que se sube algo a main.
# 1. Genera las páginas con rutas de frenoteca.com (python3 herramientas/generar.py --wp).
# 2. Copia assets/ dentro del plugin.
# 3. Sube wordpress/frenoteca-2026/ a la carpeta del plugin por la API de cPanel (HTTPS 2083).
#    El FTP no sirve: el firewall de Dongee bloquea los puertos de datos desde GitHub.
# Se activa con el secreto CPANEL_TOKEN (cPanel → Seguridad → Administrar tokens de API).
# Después de subir, purgar la caché de LiteSpeed si una página no cambia (Ajustes → Frenoteca 2026).
name: Publicar en WordPress

on:
  push:
    branches: [main]
    paths: ['herramientas/**', 'assets/**', 'wordpress/frenoteca-2026/**', '.github/workflows/wordpress.yml']
  workflow_dispatch:

concurrency:
  group: wordpress
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar páginas para frenoteca.com
        run: python3 herramientas/generar.py --wp
      - name: Copiar assets al plugin
        run: |
          rm -rf wordpress/frenoteca-2026/assets
          cp -R assets wordpress/frenoteca-2026/assets
          test -s wordpress/frenoteca-2026/paginas/index.html
          grep -q '<h1' wordpress/frenoteca-2026/paginas/index.html
      - name: Comprobar acceso a cPanel (HTTPS 2083)
        run: curl -sS -o /dev/null -m 20 -w "cPanel responde %{http_code}\n" "https://${{ vars.CPANEL_HOST || 'frenoteca.com' }}:2083/"
      - name: Subir el plugin por la API de cPanel
        if: env.CPANEL_TOKEN != ''
        env:
          CPANEL_HOST: ${{ vars.CPANEL_HOST || 'frenoteca.com' }}
          CPANEL_USUARIO: ${{ vars.CPANEL_USUARIO || 'frenoteca' }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: herramientas/subir_cpanel.sh wordpress/frenoteca-2026 "${{ vars.RUTA_PLUGIN || 'public_html/wp-content/plugins/frenoteca-2026' }}"
      - name: Sin token de cPanel
        if: env.CPANEL_TOKEN == ''
        run: echo "::warning::Falta el secreto CPANEL_TOKEN; el plugin se generó pero no se subió."
      - name: Publicar la clave de IndexNow en la raíz del sitio
        if: env.CPANEL_TOKEN != ''
        env:
          CPANEL_HOST: ${{ vars.CPANEL_HOST || 'frenoteca.com' }}
          CPANEL_USUARIO: ${{ vars.CPANEL_USUARIO || 'frenoteca' }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: herramientas/subir_cpanel.sh wordpress/raiz public_html
      - name: Avisar a buscadores (IndexNow)
        if: env.CPANEL_TOKEN != ''
        run: python3 .github/indexnow.py www.frenoteca.com https://www.frenoteca.com/frenoteca-sitemap.xml b137cf497313917f241aefca58c47edd
